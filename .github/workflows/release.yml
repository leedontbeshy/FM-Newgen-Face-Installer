name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Verify Windows release
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - name: Check tag against project version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os, tomllib; v=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert os.environ['RELEASE_TAG'] == 'v'+v, 'Tag/version mismatch'"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python tools/smoke_ui.py
      - name: Build portable release and checksum
        shell: pwsh
        run: ./build.ps1 -Python (Get-Command python).Source
      - run: python tools/smoke_exe.py dist/FMNewgenFaceInstaller/FMNewgenFaceInstaller.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-x64
          path: |
            dist/FMNewgenFaceInstaller-win-x64.zip
            dist/FMNewgenFaceInstaller-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish preview release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-windows-x64
          path: release-assets
      - name: Publish verified portable build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          release-assets/FMNewgenFaceInstaller-win-x64.zip
          release-assets/FMNewgenFaceInstaller-win-x64.zip.sha256
          --verify-tag --prerelease
          --title "FM Newgen Face Installer $RELEASE_TAG"
          --notes-file .github/release-notes.md
