[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fm-newgen-face-installer"
version = "0.1.1"
description = "A small Windows utility for safely installing Football Manager 2024 player faces."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "leedontbeshy" }]
keywords = ["football-manager", "fm24", "newgen", "facepack", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/leedontbeshy/FM-Newgen-Face-Installer"
Issues = "https://github.com/leedontbeshy/FM-Newgen-Face-Installer/issues"

[project.gui-scripts]
fm-newgen-face-installer = "app:main"

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
include = ["core*", "ui*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["build", "dist", "artifacts", "*.spec"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["E402"]
